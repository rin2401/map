    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .tide {
            display: block;
        }

        .copy-pass {
            cursor: pointer;
            user-select: none;
        }

        .icon {
            width: 1em;
            height: 1em;
            vertical-align: -0.15em;
        }

        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            align-items: center;
            justify-content: center;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>


</head>

<body>
    <div id="map"></div>
    <script>

        const map = L.map('map').setView([10.7220765, 106.743256], 13);

        // const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        //     maxZoom: 19,
        //     attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        // }).addTo(map);

        const tiles = L.tileLayer("https://{s}.google.com/vt/lyrm=m&x={x}&y={y}&z={z}", {
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google',
            maxZoom: 19,
            useCache: true,
        }).addTo(map);

        map.locate({
            // https://leafletjs.com/reference-1.7.1.html#locate-options-option
            setView: true,
            enableHighAccuracy: true,
        }).on("locationfound", (e) => {
            console.log(e);
            // marker
            const marker = L.marker([e.latitude, e.longitude]).bindPopup(
                `Your are here :)<br>${e.latitude}<br>${e.longitude}`
            );
            // circle
            // const circle = L.circle([e.latitude, e.longitude], e.accuracy / 2, {
            //     weight: 2,
            //     color: "red",
            //     fillColor: "red",
            //     fillOpacity: 0.1,
            // });
            // add marker
            map.addLayer(marker);
            // add circle
            // map.addLayer(circle);
        }).on("locationerror", (e) => {
            console.log(e);
            alert("Location access denied.");
        });

        // inline SVG icons (Lucide paths) instead of emojis
        const ICON_PATHS = {
            camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
            wifi: '<path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/>',
            key: '<path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/>',
            copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
            check: '<path d="M20 6 9 17l-5-5"/>',
            waves: '<path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1C7 13 7 11 9.5 11c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1C7 19 7 17 9.5 17c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>',
        };
        const icon = (name) =>
            `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`;

        const wifiIcon = L.icon({
            iconUrl: 'data:image/svg+xml;base64,' + btoa(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
                    <circle cx="12" cy="12" r="11" fill="#87CEEB" stroke="white" stroke-width="2"/>
                    <path d="M12 18 C12.55 18 13 17.55 13 17 C13 16.45 12.55 16 12 16 C11.45 16 11 16.45 11 17 C11 17.55 11.45 18 12 18Z" fill="white"/>
                    <path d="M9 14.5 C10.1 13.4 11.5 13 12 13 C12.5 13 13.9 13.4 15 14.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                    <path d="M7 11.5 C8.9 9.6 10.9 9 12 9 C13.1 9 15.1 9.6 17 11.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                </svg>
            `),
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
        });

        function getData(id) {
            var gid = '0';
            var url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&tq&gid=${gid}`;

            fetch(url)
                .then(x => x.text())
                .then(txt => {
                    var jsonString = txt.match(/(?<="table":).*(?=}\);)/g)[0]
                    var json = JSON.parse(jsonString)

                    var table = []
                    var row = []
                    json.cols.forEach(colonne => row.push(colonne.label))
                    table.push(row)
                    json.rows.forEach(r => {
                        var row = []
                        r.c.forEach(cel => {
                            try { var value = cel.f ? cel.f : cel.v }
                            catch (e) { var value = '' }
                            row.push(value)
                        })
                        table.push(row)
                    })



                    console.log(table)

                    for (let i = 1; i < table.length; i++) {
                        const [lat, lng, name, pass] = table[i];

                        let type = 'WPA'; // WEP | none
                        let wifiString;
                        if (pass) {
                            wifiString = `WIFI:T:WPA;S:${name};P:${pass};;`;
                        } else {
                            wifiString = `WIFI:T:nopass;S:${name};H:false;;`;
                        }
                        const qr = qrcode(0, 'L');
                        qr.addData(wifiString);
                        qr.make();

                        const esc = (s) => s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
                        const passHtml = pass
                            ? `${esc(pass)} <span class="copy-pass" data-pass="${esc(pass)}" title="Copy mật khẩu">${icon('copy')}</span>`
                            : '';
                        L.marker([lat, lng], { icon: wifiIcon }).bindPopup(`${qr.createImgTag(6)}<br>${icon('wifi')} ${esc(name)}<br>${icon('key')} ${passHtml}`).addTo(map);
                    }

                    // copy wifi password on icon click (delegated: popups come and go)
                    function copyFallback(text) {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        ta.remove();
                    }
                    document.addEventListener('click', function (e) {
                        const btn = e.target.closest('.copy-pass');
                        if (!btn) return;
                        const pass = btn.dataset.pass;
                        const done = () => {
                            btn.innerHTML = icon('check');
                            setTimeout(() => (btn.innerHTML = icon('copy')), 1500);
                        };
                        navigator.clipboard.writeText(pass)
                            .catch(() => copyFallback(pass))
                            .then(done);
                    });

                    return table
                })
        }

        getData('12q04f4hwtVQjfVSUayDsgXLGGbqrl9urm8gp556nPQA');

        // Custom camera icon
        const cameraIcon = L.icon({
            iconUrl: 'data:image/svg+xml;base64,' + btoa(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
                    <circle cx="12" cy="12" r="11" fill="#E74C3C" stroke="white" stroke-width="2"/>
                    <rect x="7" y="9" width="8" height="6" rx="1" fill="white"/>
                    <path d="M15 11 L17 9.5 L17 14.5 L15 13 Z" fill="white"/>
                    <circle cx="11" cy="12" r="1.5" fill="#E74C3C"/>
                </svg>
            `),
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
        });

        // cameras whose gov status is NOT_IMAGE (installed, no image yet)
        const cameraGrayIcon = L.icon({
            iconUrl: 'data:image/svg+xml;base64,' + btoa(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
                    <circle cx="12" cy="12" r="11" fill="#9E9E9E" stroke="white" stroke-width="2"/>
                    <rect x="7" y="9" width="8" height="6" rx="1" fill="white"/>
                    <path d="M15 11 L17 9.5 L17 14.5 L15 13 Z" fill="white"/>
                    <circle cx="11" cy="12" r="1.5" fill="#9E9E9E"/>
                </svg>
            `),
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
        });

        function getCam() {
            // worker-first: fresh list from gov.vn incl. status; Google Sheet is the fallback
            fetch('https://rinapi.rin2401.workers.dev/cams')
                .then(x => x.json())
                .then(data => renderCams(data.rows))
                .catch(() => {
                    var gid = '382031510';
                    var url = `https://docs.google.com/spreadsheets/d/12q04f4hwtVQjfVSUayDsgXLGGbqrl9urm8gp556nPQA/gviz/tq?tqx=out:json&tq&gid=${gid}`;
                    fetch(url)
                        .then(x => x.text())
                        .then(txt => {
                            var jsonString = txt.match(/(?<="table":).*(?=}\);)/g)[0]
                            var json = JSON.parse(jsonString)
                            var rows = json.rows.map(r => {
                                var cel = r.c || [];
                                const v = i => (cel[i] ? (cel[i].f ?? cel[i].v ?? '') : '');
                                // sheet has no status column: [lat, lng, location, cam_id, angle, elevation]
                                return [v(0), v(1), v(2), v(3), v(4), ''];
                            });
                            renderCams(rows);
                        });
                });
        }

        function renderCams(rawRows) {
            // /cams rows are arrays, but an older cached response may still be
            // object-shaped; normalize so the destructure below always works
            const rows = rawRows.map((r) =>
                Array.isArray(r) ? r : [r.lat, r.lng, r.location, r.cam_id, r.angle, r.status],
            );
            // tide is hourly data: one shared 5-minute cache for all popups
            const tideCache = { data: null, ts: 0 };
            const TIDE_TTL = 5 * 60 * 1000;

            for (let i = 0; i < rows.length; i++) {
                const [lat, lng, location, cam_id, angle, status] = rows[i];

                let image_url = `https://rinapi.rin2401.workers.dev/cam?id=${cam_id}`;

                let image_raw_url = `https://giaothong.hochiminhcity.gov.vn/render/ImageHandler.ashx?id=${cam_id}`;
                marker = L.marker([lat, lng], {
                    icon: status === 'NOT_IMAGE' ? cameraGrayIcon : cameraIcon,
                    rotationAngle: -(parseInt(angle) || 0),
                    rotationOrigin: 'center center'
                })

                        // rinapi (proxied, CDN+browser cached 60s) first; raw gov endpoint is flaky, keep as fallback
                        let popup_html = `<img src="${image_url}" onerror="this.onerror=null;this.src='${image_raw_url}';" width="100%"></img>${icon('camera')} <a href="${image_raw_url}" target="_blank">${location}</a><span class="tide"></span>`
                        marker.bindPopup(popup_html, {
                            minWidth: Math.min(720, window.innerWidth)
                        })


                        marker.on('popupopen', function (e) {
                            // fill the tide slot in place instead of setContent,
                            // so re-rendering the popup does not refetch the image
                            const tideEl = e.popup.getElement().querySelector('.tide');
                            const renderTide = (x) => {
                                tideEl.innerHTML = `${icon('waves')} Thủy triều: <a href="${x.url}" target="_blank">${x.current_height}m</a>`;
                            };

                            if (tideCache.data && Date.now() - tideCache.ts < TIDE_TTL) {
                                renderTide(tideCache.data);
                                return;
                            }

                            var api_url = `https://rinapi.rin2401.workers.dev/tide?location=sai-gon`;
                            fetch(api_url)
                                .then(x => x.json())
                                .then(x => {
                                    tideCache.data = x;
                                    tideCache.ts = Date.now();
                                    renderTide(x)
                                });

                        });

                        marker.addTo(map);
                    }
        }

        getCam();


    </script>

        gtag('js', new Date());

        gtag('config', 'G-1PSF8GWBEY');
    </script>
</body>
